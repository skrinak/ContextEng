- id: us-sec-204-2.e2
  instrument: us-sec-204-2
  title: Organizational records kept three years past termination of the enterprise
  kind: retention
  applies_to: Registered investment advisers
  requirement: Keep partnership articles, articles of incorporation, charters, minute books and stock certificate books in the principal office until at least three years after the enterprise terminates.
  retention: {period: P3Y, trigger: "Termination of the enterprise"}
  source:
    citation: 17 CFR 275.204-2(e)(2)
    url: https://www.ecfr.gov/current/title-17/section-275.204-2#p-275.204-2(e)(2)
    quote: >-
      (2) Partnership articles and any amendments thereto, articles of incorporation, charters, minute books, and stock certificate books of the investment adviser and of any predecessor, shall be maintained in the principal office of the investment adviser and preserved until at least three years after termination of the enterprise.
    retrieved: "2026-09-18"
    text_as_of: eCFR, up to date as of 2026-09-16
  confidence: high
  verified: {date: "2026-09-18", by: claude-opus-5 agent session (not reviewed by counsel), method: Quote compared verbatim against the eCFR text}
  review_due: "2027-03-18"

- id: us-sec-204-2.g2
