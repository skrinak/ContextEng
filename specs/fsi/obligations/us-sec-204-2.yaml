- id: us-sec-204-2.g2iii
  instrument: us-sec-204-2
  title: Separately stored duplicate copy for the full retention period
  kind: form
  applies_to: Investment advisers keeping records on micrographic or electronic storage media
  requirement: Store a duplicate copy of every record separately, on any permitted medium, for as long as the original must be preserved.
  source:
    citation: 17 CFR 275.204-2(g)(2)(iii)
    url: https://www.ecfr.gov/current/title-17/section-275.204-2#p-275.204-2(g)(2)(iii)
    quote: >-
      (iii) Separately store, for the time required for preservation of the original record, a duplicate copy of the record on any medium allowed by this section.
