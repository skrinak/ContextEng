- id: us-sec-204-2.e1
  instrument: us-sec-204-2
  title: Five-year retention from the end of the fiscal year of the last entry
  kind: retention
  applies_to: Registered investment advisers
  requirement: Keep the required books and records in an easily accessible place for at least five years from the end of the fiscal year of the last entry, the first two years in an appropriate office of the adviser.
  retention: {period: P5Y, accessible_period: P2Y, trigger: "End of the fiscal year during which the last entry was made on the record"}
  source:
    citation: 17 CFR 275.204-2(e)(1)
    url: https://www.ecfr.gov/current/title-17/section-275.204-2#p-275.204-2(e)(1)
    quote: >-
      shall be maintained and preserved in an easily accessible place for a period of not less than five years from the end of the fiscal year during which the last entry was made on such record, the first two years in an appropriate office of the investment adviser.
