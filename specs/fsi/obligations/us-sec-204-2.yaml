- id: us-sec-204-2.g3
  instrument: us-sec-204-2
  title: Safeguard electronic records and limit access
  kind: form
  applies_to: Investment advisers keeping records on electronic storage media
  requirement: Maintain procedures that reasonably safeguard records from loss, alteration or destruction, limit access to authorized personnel and the Commission, and ensure that reproductions of non-electronic originals are complete, true and legible.
  source:
    citation: 17 CFR 275.204-2(g)(3)
    url: https://www.ecfr.gov/current/title-17/section-275.204-2#p-275.204-2(g)(3)
    quote: >-
      (i) To maintain and preserve the records, so as to reasonably safeguard them from loss, alteration, or destruction; (ii) To limit access to the records to properly authorized personnel and the Commission (including its examiners and other representatives); and (iii) To reasonably ensure that any reproduction of a non-electronic original record on electronic storage media is complete, true, and legible when retrieved.
    retrieved: "2026-09-18"
