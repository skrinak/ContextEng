- id: us-finra-4511.b
  instrument: us-finra-4511
  title: Six-year default retention where no other period is specified
  kind: retention
  applies_to: FINRA member firms
  requirement: Preserve FINRA books and records that have no period specified in FINRA rules or applicable Exchange Act rules for at least six years.
  retention: {period: P6Y, trigger: "The rule states the period without naming its start."}
  source:
    citation: FINRA Rule 4511(b)
    url: https://www.finra.org/rules-guidance/rulebooks/finra-rules/4511
    quote: >-
      (b) Members shall preserve for a period of at least six years those FINRA books and records for which there is no specified period under the FINRA rules or applicable Exchange Act rules.
    retrieved: "2026-09-18"
  confidence: high
