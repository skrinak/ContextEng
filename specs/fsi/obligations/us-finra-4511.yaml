- id: us-finra-4511.c
  instrument: us-finra-4511
  title: Preserve in a format and media that complies with SEA Rule 17a-4
  kind: form
  applies_to: FINRA member firms
  requirement: Preserve records required by FINRA rules in a format and media that complies with SEA Rule 17a-4.
