- id: us-sec-17a-3.a
  instrument: us-sec-17a-3
  title: Make and keep current the required books and records
  kind: creation
  applies_to: Exchange members, brokers and dealers
  requirement: Create each book and record listed in paragraph (a) of the rule and keep it current. Retention periods are set by the preservation rule; see the linked obligations.
