- id: us-sec-17a-4.j
  instrument: us-sec-17a-4
  title: Furnish records promptly, electronically where requested
  kind: production
  applies_to: Members, brokers and dealers subject to Rule 17a-4
  requirement: On request, promptly furnish the Commission with legible, true, complete and current copies of required records. Electronic records, with their audit trail, go in a reasonably usable electronic format if requested.
  source:
    citation: 17 CFR 240.17a-4(j)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(j)
    quote: >-
      (j) Every member, broker and dealer subject to this section must furnish promptly to a representative of the Commission legible, true, complete, and current copies of those records of the member, broker, or dealer that are required to be preserved under this section
