- id: us-sec-17a-4.b
  instrument: us-sec-17a-4
  title: Three-year retention for other records, including business communications
  kind: retention
  applies_to: Members, brokers and dealers subject to Rule 17a-3
  requirement: Preserve the paragraph (b) records for at least three years, the first two in an easily accessible place. They include bank records, trial balances, written agreements, and originals or copies of all business communications sent and received.
  retention: {period: P3Y, accessible_period: P2Y, trigger: "The rule states the period without naming its start; firms conventionally run it from the record's creation."}
  source:
    citation: 17 CFR 240.17a-4(b), (b)(4)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(b)
    quote: >-
      (b) Every member, broker or dealer subject to § 240.17a-3 must preserve for a period of not less than three years, the first two years in an easily accessible place: [...] (4) Originals of all communications received and copies of all communications sent (and any approvals thereof) by the member, broker or dealer (including inter-office memoranda and communications) relating to its business as such
