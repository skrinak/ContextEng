- id: us-sec-17a-4.i
  instrument: us-sec-17a-4
  title: Undertaking from a third-party recordkeeper, including a cloud provider
  kind: undertaking
  applies_to: Broker-dealers whose records are held by an outside service, including one that owns and operates the storage servers
  requirement: When an outside entity prepares or keeps the records, including one that owns the storage servers, it must file a written undertaking with the Commission. If the broker-dealer has independent access to the records, a shorter undertaking in which the outside entity agrees not to impede examination may be filed instead.
  note: This is the obligation most directly engaged by hosting records on a public cloud. Independent access means the firm can reach the records without any intervention by the provider.
  source:
    citation: 17 CFR 240.17a-4(i)(1)(i) and (ii)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(i)
    quote: >-
      (i)(1)(i) If the records required to be maintained and preserved pursuant to the provisions of § 240.17a-3 and this section are prepared or maintained by an outside service bureau, depository, bank, or other recordkeeping service, including a recordkeeping service that owns and operates the servers or other storage devices on which the records are preserved or maintained, (none of which operate pursuant to § 240.17a-3(c)) on behalf of the member, broker, or dealer required to maintain and preserve such records, such outside entity must file with the Commission a written undertaking in a form acceptable to the Commission
    retrieved: "2026-09-18"
    text_as_of: eCFR, up to date as of 2026-09-16
  confidence: high
  verified: {date: "2026-09-18", by: claude-opus-5 agent session (not reviewed by counsel), method: Quote compared verbatim against the eCFR text}
