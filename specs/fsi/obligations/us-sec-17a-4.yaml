- id: us-sec-17a-4.a
  instrument: us-sec-17a-4
  title: Six-year retention for blotters, ledgers and core records
  kind: retention
  applies_to: Members, brokers and dealers subject to Rule 17a-3
  requirement: Preserve the records made under Rule 17a-3(a)(1)-(3), (5), (21) and (22) for at least 6 years, the first two years in an easily accessible place.
  retention: {period: P6Y, accessible_period: P2Y, trigger: "The rule states the period without naming its start; firms conventionally run it from the record's creation."}
  source:
    citation: 17 CFR 240.17a-4(a)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(a)
    quote: >-
      (a) Every member, broker or dealer subject to § 240.17a-3 must preserve for a period of not less than 6 years, the first two years in an easily accessible place, all records required to be made pursuant to § 240.17a-3(a)(1) through (3), (5), and (21) and (22), and analogous records created pursuant to § 240.17a-3(e).
