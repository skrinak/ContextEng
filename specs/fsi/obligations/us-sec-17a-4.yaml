- id: us-sec-17a-4.f2i
  instrument: us-sec-17a-4
  title: Electronic records need a complete audit trail or non-rewriteable, non-erasable storage
  kind: form
  applies_to: Broker-dealers keeping required records on an electronic recordkeeping system
  requirement: For the whole retention period, either keep a complete time-stamped audit trail of every modification and deletion that allows the original record to be re-created, or store the records exclusively in non-rewriteable, non-erasable (WORM) form.
  source:
    citation: 17 CFR 240.17a-4(f)(2)(i)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(f)(2)(i)
    quote: >-
      (i)(A) Preserve a record for the duration of its applicable retention period in a manner that maintains a complete time-stamped audit trail that includes: [...] (4) Any other information needed to maintain an audit trail of the record in a way that maintains security, signatures, and data to ensure the authenticity and reliability of the record and will permit re-creation of the original record if it is modified or deleted; or (B) Preserve the records exclusively in a non-rewriteable, non-erasable format;
    retrieved: "2026-09-18"
    text_as_of: eCFR, up to date as of 2026-09-16
  confidence: high
  verified: {date: "2026-09-18", by: claude-opus-5 agent session (not reviewed by counsel), method: Quote compared verbatim against the eCFR text}
  review_due: "2027-03-18"

