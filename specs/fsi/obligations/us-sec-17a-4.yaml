- id: us-sec-17a-4.c
  instrument: us-sec-17a-4
  title: Account-opening records kept six years after the account closes
  kind: retention
  applies_to: Members, brokers and dealers subject to Rule 17a-3
  requirement: Preserve account cards or records on the terms of opening and maintaining a customer account until at least six years after the account closes.
  retention: {period: P6Y, trigger: "Closing of the customer's account"}
  source:
    citation: 17 CFR 240.17a-4(c)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(c)
    quote: >-
      (c) Every member, broker or dealer subject to § 240.17a-3 must preserve for a period of not less than six years after the closing of any customer's account any account cards or records which relate to the terms and conditions with respect to the opening and maintenance of the account.
