- id: us-sec-17a-4.f2v
  instrument: us-sec-17a-4
  title: Backup recordkeeping system or equivalent redundancy
  kind: form
  applies_to: Broker-dealers keeping required records on an electronic recordkeeping system
  requirement: Keep a backup electronic recordkeeping system that meets the same requirements and can serve as a redundant set of records, or have other redundancy that ensures access to the records.
  source:
    citation: 17 CFR 240.17a-4(f)(2)(v)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(f)(2)(v)
    quote: >-
      (v)(A) Include a backup electronic recordkeeping system that meets the other requirements of this paragraph (f) and that retains the records required to be maintained and preserved pursuant to § 240.17a-3 and in accordance with this section in a manner that will serve as a redundant set of records if the original electronic recordkeeping system is temporarily or permanently inaccessible; or (B) Have other redundancy capabilities that are designed to ensure access to the records required to be maintained and preserved pursuant to § 240.17a-3 and this section.
    retrieved: "2026-09-18"
    text_as_of: eCFR, up to date as of 2026-09-16
  confidence: high
  verified: {date: "2026-09-18", by: claude-opus-5 agent session (not reviewed by counsel), method: Quote compared verbatim against the eCFR text}
  review_due: "2027-03-18"

- id: us-sec-17a-4.f3iv
  instrument: us-sec-17a-4
  title: Keep the information needed to locate electronic records
  kind: production
  applies_to: Broker-dealers using an electronic recordkeeping system
  requirement: Organize and keep current all information needed to access and locate records on the electronic system, and provide it promptly when regulators ask.
  source:
    citation: 17 CFR 240.17a-4(f)(3)(iv)
    url: https://www.ecfr.gov/current/title-17/section-240.17a-4#p-240.17a-4(f)(3)(iv)
    quote: >-
      (iv) Organize, maintain, keep current, and provide promptly upon request by the staffs of the Commission, the self-regulatory organizations of which the member, broker, or dealer is a member, or any State securities regulator having jurisdiction over the member, broker, or dealer all information necessary to access and locate records preserved by means of the electronic recordkeeping system.
