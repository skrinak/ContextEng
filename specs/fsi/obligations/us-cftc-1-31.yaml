- id: us-cftc-1-31.c2
  instrument: us-cftc-1-31
  title: Systems and controls for authentic, reliable, available electronic records, plus a system inventory
  kind: form
  applies_to: CFTC records entities maintaining electronic regulatory records
  requirement: Establish systems that preserve the security, signature and data of electronic records, ensure they can be produced and stay available through a disruption, and keep an up-to-date inventory of every system needed to access or produce them.
  source:
    citation: 17 CFR 1.31(c)(2)
    url: https://www.ecfr.gov/current/title-17/section-1.31#p-1.31(c)(2)
    quote: >-
      (2) Electronic regulatory records. Each records entity maintaining electronic regulatory records shall establish appropriate systems and controls that ensure the authenticity and reliability of electronic regulatory records, including, without limitation: [...] (ii) Systems that ensure the records entity is able to produce electronic regulatory records in accordance with this section, and ensure the availability of such regulatory records in the event of an emergency or other disruption of the records entity's electronic record retention systems; and (iii) The creation and maintenance of an up-to-date inventory that identifies and describes each system that maintains information necessary for accessing or producing electronic regulatory records.
    retrieved: "2026-09-18"
    text_as_of: eCFR, up to date as of 2026-09-16
  confidence: high
  verified: {date: "2026-09-18", by: claude-opus-5 agent session (not reviewed by counsel), method: Quote compared verbatim against the eCFR text}
  review_due: "2027-03-18"

