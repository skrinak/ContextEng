- id: us-cftc-1-31.b1
  instrument: us-cftc-1-31
  title: Swap records kept five years after the transaction ends
  kind: retention
  applies_to: CFTC records entities holding records of swaps or related cash or forward transactions
  requirement: Keep regulatory records of each swap or related cash or forward transaction from creation until the transaction terminates, matures, expires, or is transferred, assigned or novated, and for at least five years after that.
  retention: {period: P5Y, trigger: "Termination, maturity, expiration, transfer, assignment or novation date of the transaction"}
  source:
    citation: 17 CFR 1.31(b)(1)
    url: https://www.ecfr.gov/current/title-17/section-1.31#p-1.31(b)(1)
    quote: >-
      (1) A records entity shall keep regulatory records of any swap or related cash or forward transaction (as defined in § 23.200(i) of this chapter), other than regulatory records required by § 23.202(a)(1) and (b)(1)-(3) of this chapter, from the date the regulatory record was created until the termination, maturity, expiration, transfer, assignment, or novation date of the transaction and for a period of not less than five years after such date.
    retrieved: "2026-09-18"
    text_as_of: eCFR, up to date as of 2026-09-16
  confidence: high
  verified: {date: "2026-09-18", by: claude-opus-5 agent session (not reviewed by counsel), method: Quote compared verbatim against the eCFR text}
  review_due: "2027-03-18"

