- id: us-cftc-1-31.b4
  instrument: us-cftc-1-31
  title: Electronic records readily accessible for the whole retention period
  kind: retention
  applies_to: CFTC records entities
  requirement: Keep paper-only regulatory records readily accessible for at least two years, and electronic regulatory records readily accessible for the whole required period.
  retention: {accessible_period: P2Y, trigger: "Paper-only records are readily accessible for the stated window; electronic records stay readily accessible for their full retention period."}
  source:
    citation: 17 CFR 1.31(b)(4)
    url: https://www.ecfr.gov/current/title-17/section-1.31#p-1.31(b)(4)
    quote: >-
      (4) A records entity shall keep regulatory records exclusively created and maintained on paper readily accessible for no less than two years. A records entity shall keep electronic regulatory records readily accessible for the duration of the required record keeping period.
