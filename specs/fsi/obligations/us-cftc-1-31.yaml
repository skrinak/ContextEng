- id: us-cftc-1-31.b3
  instrument: us-cftc-1-31
  title: All other regulatory records kept five years from creation
  kind: retention
  applies_to: CFTC records entities
  requirement: Keep every other regulatory record for at least five years from the date it was created.
  retention: {period: P5Y, trigger: "Date the record was created"}
  source:
    citation: 17 CFR 1.31(b)(3)
    url: https://www.ecfr.gov/current/title-17/section-1.31#p-1.31(b)(3)
    quote: >-
      (3) A records entity shall keep each regulatory record other than the records described in paragraphs (b)(1) or (b)(2) of this section for a period of not less than five years from the date on which the record was created.
