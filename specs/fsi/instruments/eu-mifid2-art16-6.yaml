summary: Article 16(6) requires records sufficient for supervision but states no retention period. The periods come from Article 16(7) for recorded communications and MiFIR Article 25(1) for order and transaction data. Commission Delegated Regulation 2017/565 Article 72 sets the storage-medium conditions.
